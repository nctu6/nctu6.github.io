    <section class="hero" aria-labelledby="site-title">
      <div class="hero-copy">
        <p class="studio-label" data-i18n="heroEyebrow">獨立 AI 工作室</p>
        <h1 id="site-title">
          <span data-i18n="heroTitle">研究語言模型，</span>
          <span class="headline-accent" data-i18n="heroTitleAccent">打造日常工具。</span>
        </h1>
        <p class="hero-description"><span data-i18n="heroLeadOne">從 AI Agent 實驗、iOS App 到網路工具，</span>
          <span data-i18n="heroLeadTwo">我把工程點子做成自己也想每天用的產品。</span></p>
        <div class="hero-actions">
          <a class="button primary" href="#works"><span data-i18n="heroWorks">探索作品</span><img class="icon" src="/assets/portfolio/arrow-right.svg" width="16" height="16" alt=""></a>
          <a class="button" href="/about.html" data-i18n="heroAbout">關於工作室</a>
        </div>
      </div>
      <div class="inference" role="group" aria-labelledby="inference-title">
        <div class="inference-header">
          <span class="inference-label">
            <img class="inference-dot" src="/assets/portfolio/accent.svg" width="6" height="6" alt="">
            <span id="inference-title" data-i18n="inferenceTitle">推論流程</span>
          </span>
          <span class="inference-caption">LLM INFERENCE</span>
        </div>
        <picture class="inference-wave">
          <source media="(max-width: 740px)" srcset="/assets/portfolio/wave-mobile.svg" width="342" height="154">
          <img src="/assets/portfolio/wave.svg" width="560" height="252" alt="">
        </picture>
        <ol class="inference-stages">
          <li><span data-i18n="inferenceContext">上下文</span><img class="inference-arrow" src="/assets/portfolio/flow.svg" width="12" height="12" alt=""></li>
          <li><span class="active" data-i18n="inferenceModel">模型推論</span><img class="inference-arrow" src="/assets/portfolio/flow.svg" width="12" height="12" alt=""></li>
          <li><span data-i18n="inferenceOutput">回覆</span></li>
        </ol>
      </div>
    </section>

    <section id="popular" class="popular" aria-labelledby="popular-heading" hidden>
      <div class="section-head">
        <h2 id="popular-heading" data-i18n="popularTitle">熱門作品</h2>
        <a class="text-link" href="#works"><span data-i18n="worksAllLink">全部作品</span><img class="icon" src="/assets/portfolio/arrow-down.svg" width="16" height="16" alt=""></a>
      </div>
      <div class="popular-grid" id="popular-list"></div>
    </section>

    <section id="works" class="works" aria-labelledby="works-heading">
      <div class="section-head">
        <h2 id="works-heading" data-i18n="worksTitle">所有作品</h2>
        <p id="works-count" class="works-count" aria-live="polite"></p>
      </div>
      <div class="works-controls">
        <div class="works-toolbar" role="search">
          <label class="works-search">
            <span class="sr-only" data-i18n="worksSearchLabel">搜尋作品</span>
            <img class="icon" src="/assets/portfolio/search.svg" width="16" height="16" alt="">
            <input id="works-q" type="search" autocomplete="off" spellcheck="false" placeholder="搜尋作品名稱、標籤或網域" data-i18n-attr="placeholder:worksSearchPlaceholder">
          </label>
          <label class="works-sort">
            <span class="sr-only" data-i18n="worksSortLabel">排序</span>
            <select id="works-sort">
              <option value="popular" data-i18n="worksSortPopular">熱門</option>
              <option value="newest" data-i18n="worksSortNewest">最新</option>
              <option value="oldest" data-i18n="worksSortOldest">最舊</option>
            </select>
            <img class="icon" src="/assets/portfolio/chevron-down.svg" width="16" height="16" alt="">
          </label>
          <div class="works-view" role="group" aria-label="檢視方式" data-i18n-attr="aria-label:worksViewLabel">
            <button type="button" data-view="grid" aria-pressed="true" aria-label="格狀檢視" data-i18n-attr="aria-label:worksViewGrid;title:worksViewGrid"><img class="icon" src="/assets/portfolio/grid.svg" width="16" height="16" alt=""></button>
            <button type="button" data-view="list" aria-pressed="false" aria-label="清單檢視" data-i18n-attr="aria-label:worksViewList;title:worksViewList"><img class="icon" src="/assets/portfolio/list.svg" width="16" height="16" alt=""></button>
          </div>
        </div>
        <div class="works-chips" id="works-chips" role="group" aria-label="依分類篩選" data-i18n-attr="aria-label:worksCategoryLabel"></div>
      </div>
      <div id="works-list" class="works-grid" aria-busy="true"></div>
      <p id="works-unavailable" data-i18n="worksUnavailable" hidden>暫時無法載入作品。</p>
      <div id="works-empty" class="works-empty" hidden>
        <p data-i18n="worksEmpty">沒有符合條件的作品。</p>
        <button type="button" class="button" id="works-clear" data-i18n="worksClear">清除篩選</button>
      </div>
      <button type="button" class="button works-more" id="works-more" hidden></button>
