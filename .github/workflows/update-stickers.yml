name: Update LINE stickers

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update sticker data
        run: node scripts/update-stickers.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stickers.json
          if git diff --cached --quiet; then
            echo "No sticker data changes."
          else
            git commit -m "Update LINE sticker data"
            git push
          fi
